components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 token

  parameters:
    campaignId:
      name: campaignId
      in: path
      description: ID of the campaign
      required: true
      schema:
        type: integer
    
    entityId:
      name: entityId
      in: path
      description: ID of the entity
      required: true
      schema:
        type: integer
    
    postId:
      name: postId
      in: path
      description: ID of the post
      required: true
      schema:
        type: integer
    
    attributeId:
      name: attributeId
      in: path
      description: ID of the attribute
      required: true
      schema:
        type: integer

  schemas:
    # Base response format
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
        last:
          type: string
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    # 1. Posts
    PostList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    Post:
      type: object
      properties:
        id:
          type: integer
        entity_id:
          type: integer
        name:
          type: string
        entry:
          type: string
        entry_parsed:
          type: string
        visibility:
          type: string
          enum: [all, members, admin, self]
        position:
          type: integer
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time

    # 6. Entity Tags
    EntityTagList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityTag'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    EntityTag:
      type: object
      properties:
        id:
          type: integer
        entity_id:
          type: integer
        tag_id:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: integer

    EntityTagRequest:
      type: object
      required:
        - tag_id
      properties:
        tag_id:
          type: integer

    # 7. Entity Permissions
    EntityPermissionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityPermission'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    EntityPermission:
      type: object
      properties:
        id:
          type: integer
        entity_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        role_id:
          type: integer
          nullable: true
        access:
          type: string
          enum: [read, write, delete, admin]

    # 8. Relations
    RelationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    Relation:
      type: object
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        target_id:
          type: integer
        relation:
          type: string
        attitude:
          type: integer
        color:
