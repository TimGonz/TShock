  # 10. Entity Image
  /campaigns/{campaignId}/entities/{entityId}/entity_image:
    parameters:
      - $ref: '#/components/parameters/campaignId'
      - $ref: '#/components/parameters/entityId'
    post:
      summary: Upload an image for an entity
      operationId: uploadEntityImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
