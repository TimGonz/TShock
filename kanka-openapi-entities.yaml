openapi: 3.0.3
info:
  title: Kanka API - Entity Endpoints
  description: Entity-related endpoints for Kanka, a free online worldbuilding and RPG campaign management tool.
  version: 1.0.0
  contact:
    name: Kanka
    url: https://kanka.io
servers:
  - url: https://api.kanka.io/1.0
    description: Production API server
security:
  - BearerAuth: []

paths:
  # 1. Posts
  /campaigns/{campaignId}/entities/{entityId}/posts:
    parameters:
      - $ref: '#/components/parameters/campaignId'
      - $ref: '#/components/parameters/entityId'
    get:
      summary: Get all posts for an entity
      operationId: getEntityPosts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
    post:
      summary: Create a new post for an entity
      operationId: createEntityPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /campaigns/{campaignId}/entities/{entityId}/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/campaignId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/postId'
    get:
      summary: Get a specific post from an entity
      operationId: getEntityPost
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
    put:
      summary: Update a post
      operationId: updateEntityPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
    delete:
      summary: Delete a post
      operationId: deleteEntityPost
      responses:
        '200':
          description: Successful operation

  # 2. Attributes
  /campaigns/{campaignId}/entities/{entityId}/attributes:
